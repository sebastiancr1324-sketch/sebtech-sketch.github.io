<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto | SebTech</title>
  <meta name="description" content="Detalle del producto en SebTech">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <a href="../index.html" class="header__logo"><img src="../img/LogoSebtechMinimalita.png" alt="Logo SebTech" class="header__logo-img"><span>Seb<span class="header__logo-accent">Tech</span></span></a>
      <button class="header__toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="header__nav" aria-label="Navegación principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="productos.html" aria-current="page">Productos</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="producto-detail" id="producto-contenido">
      <p class="producto-detail__loading">Cargando producto...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div>
        <p class="footer__brand">Seb<span class="header__logo-accent">Tech</span></p>
        <p class="footer__tagline">Tecnología para tu día</p>
      </div>
      <div class="footer__social">
        <a href="https://instagram.com/sebtech.ar" target="_blank" rel="noopener" aria-label="Instagram de SebTech">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a href="https://wa.me/message/NDPQOF3UHLIQF1" target="_blank" rel="noopener" aria-label="WhatsApp de SebTech">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.5 8.5 0 01-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1121 11.5z"/></svg>
        </a>
      </div>
    </div>
    <p class="footer__legal">© 2026 SebTech. Todos los derechos reservados.</p>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var contenedor = document.getElementById('producto-contenido');

      if (!id) {
        contenedor.innerHTML = '<p class="producto-detail__error">Producto no encontrado. <a href="productos.html">Volver al catálogo</a></p>';
        return;
      }

      var producto = obtenerProductoPorId(id);

      if (!producto) {
        contenedor.innerHTML = '<p class="producto-detail__error">Producto no encontrado. <a href="productos.html">Volver al catálogo</a></p>';
        return;
      }

      document.title = producto.nombre + ' | SebTech';

      var specsHtml = '';
      if (producto.especificaciones && producto.especificaciones.length > 0) {
        specsHtml = '<ul class="producto-detail__specs">';
        for (var i = 0; i < producto.especificaciones.length; i++) {
          specsHtml += '<li>' + producto.especificaciones[i] + '</li>';
        }
        specsHtml += '</ul>';
      }

      contenedor.innerHTML =
        '<div class="producto-detail__volver">' +
          '<a href="productos.html" class="producto-detail__back">&larr; Volver al catálogo</a>' +
        '</div>' +
        '<div class="producto-detail__grid">' +
          '<div class="producto-detail__gallery">' +
            '<img src="' + producto.imagen + '" alt="' + producto.nombre + '" class="producto-detail__img">' +
          '</div>' +
          '<div class="producto-detail__info">' +
            '<span class="producto-detail__category">' + producto.categoria + '</span>' +
            '<h1 class="producto-detail__title">' + producto.nombre + '</h1>' +
            '<p class="producto-detail__price">' + formatearPrecio(producto.precio) + '</p>' +
            '<p class="producto-detail__desc">' + producto.descripcion + '</p>' +
            (specsHtml ? '<div class="producto-detail__specs-section"><h3>Especificaciones</h3>' + specsHtml + '</div>' : '') +
            '<div class="producto-detail__actions">' +
              '<a href="https://wa.me/message/NDPQOF3UHLIQF1?text=Hola!%20Quiero%20consultar%20por%20el%20' + encodeURIComponent(producto.nombre) + '" class="btn btn--primary" target="_blank" rel="noopener">Consultar por WhatsApp</a>' +
            '</div>' +
          '</div>' +
        '</div>';
    });
  </script>

</body>
</html>
