<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explora nuestro catálogo de productos: celulares, tablets y auriculares de calidad. Envios a todo CABA">
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

</head>
<body>
    <header class="header">
    <div class="header__inner">
      <a href="../index.html" class="header__logo"><img src="../img/LogoSebtechMinimalita.png" alt="Logo SebTech" class="header__logo-img"><span>Seb<span class="header__logo-accent">Tech</span></span></a>

      <button class="header__toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

      <nav class="header__nav" aria-label="Navegación principal">
        <ul>
          <li><a href="../index.html" >Inicio</a></li>
          <li><a href="productos.html" aria-current="page">Productos</a></li>
          <li><a href="envios.html">Envíos</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <main>
    <div class="pagina-header">
      <span class="pagina-header__eyebrow">Catálogo</span>
      <h1 class="pagina-header__title">Nuestros productos</h1>
    </div>

    <div id="catalogo-container"></div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div>
        <p class="footer__brand">Seb<span class="header__logo-accent">Tech</span></p>
        <p class="footer__tagline">Tecnología para tu día</p>
      </div>

      <div class="footer__social">
        <a href="https://instagram.com/sebtech.ar" target="_blank" rel="noopener" aria-label="Instagram de SebTech">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a href="https://wa.me/message/NDPQOF3UHLIQF1" target="_blank" rel="noopener" aria-label="WhatsApp de SebTech">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.5 8.5 0 01-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1121 11.5z"/></svg>
        </a>
      </div>
    </div>
    <p class="footer__legal">© 2026 SebTech. Todos los derechos reservados.</p>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var categorias = ["celulares", "tablets", "auriculares"];
      var container = document.getElementById("catalogo-container");
      var html = "";

      for (var c = 0; c < categorias.length; c++) {
        var cat = categorias[c];
        var productosCat = obtenerProductosPorCategoria(cat);

        if (productosCat.length === 0) continue;

        var tituloCat = cat.charAt(0).toUpperCase() + cat.slice(1);

        html += '<section class="categoria-seccion" id="' + cat + '" aria-labelledby="' + cat + '-title">';
        html += '<h2 class="categoria-seccion__title" id="' + cat + '-title">' + tituloCat + '</h2>';
        html += '<div class="categoria-seccion__grid">';

        for (var p = 0; p < productosCat.length; p++) {
          var prod = productosCat[p];
          html += '<a href="producto.html?id=' + prod.id + '" class="card-producto">';
          html += '<div class="card-producto__media">';
          html += '<img src="' + obtenerImagenPrincipal(prod) + '" alt="' + prod.nombre + '">';
          html += '</div>';
          html += '<div class="card-producto__body">';
          html += '<h3 class="card-producto__title">' + prod.nombre + '</h3>';
          html += '<p class="card-producto__desc">' + prod.descripcion + '</p>';
          html += '<div class="card-producto__footer">';
          html += '<span class="card-producto__price">' + formatearPrecio(prod.precio) + '</span>';
          html += '<span class="card-producto__cta">Ver producto</span>';
          html += '</div>';
          html += '</div>';
          html += '</a>';
        }

        html += '</div>';
        html += '</section>';
      }

      container.innerHTML = html;
    });
  </script>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="../js/aos-config.js"></script>
</body>
</html>
